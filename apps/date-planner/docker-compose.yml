# A Postgres for local development and the test suite.
#
#   docker compose up -d        # from apps/date-planner
#   docker compose down -v      # stop and wipe it
#
# Port 5434 so it collides with neither the meal-planner stack (5432) nor
# tee-time-booker (5433). The URLs to put in .env:
#   DATABASE_URL=postgresql://postgres:postgres@localhost:5434/date_planner
#   DATE_PLANNER_TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5434/date_planner_test

name: date-planner

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: date_planner
    ports:
      - "${DATE_PLANNER_DB_PORT:-5434}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Creates the test database alongside the dev one on first start.
      - ./scripts/create-test-db.sh:/docker-entrypoint-initdb.d/create-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d date_planner"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Optional self-hosted road routing for TRAVEL_PROVIDER=osrm. Off unless
  # asked for:  docker compose --profile routing up -d
  # Needs the Southern California extract prepared first — see the README
  # ("Road routing with OSRM"). Car profile only: walking legs fall back to
  # whatever this one instance serves, so keep TRAVEL_PROVIDER=haversine if
  # a day is mostly on foot.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["routing"]
    command: osrm-routed --algorithm mld /data/socal-latest.osrm
    ports:
      - "${OSRM_PORT:-5000}:5000"
    volumes:
      - ./data/osrm:/data

volumes:
  db_data:
