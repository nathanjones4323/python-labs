[project]
name = "date-planner"
version = "0.1.0"
description = "MCP server for date planning: restaurants, booking channels, deep links, booking windows"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0",
    "sqlalchemy>=2.0.54",
    "alembic>=1.20.0",
    "asyncpg>=0.30.0",
    "greenlet>=3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "selectolax>=0.3.21",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.0",
    "astral>=3.2",
    "pillow>=11.0",
]

[project.scripts]
date-planner-mcp = "date_planner.server:main"
date-planner-reset = "date_planner.reset:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
# No stubs on PyPI for either.
module = ["selectolax.*", "respx.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0",
    "respx>=0.22.0",
    "mypy>=1.14",
    "types-python-dateutil>=2.9",
    "jsonschema>=4.26",
    "types-jsonschema>=4.26",
]

[tool.hatch.build.targets.wheel]
packages = ["src/date_planner"]
