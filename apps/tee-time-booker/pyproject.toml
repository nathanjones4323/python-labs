[project]
name = "tee-time-booker"
version = "0.1.0"
description = "Books tee times with Playwright on a schedule, one adapter per booking site"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.47.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
]

[project.scripts]
tee-time-booker = "tee_time_booker.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tee_time_booker"]
