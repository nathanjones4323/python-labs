[project]
name = "pay-my-bills"
version = "0.1.0"
description = "Watches Gmail for utility autopay emails and asks the roommate for their half over Venmo"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.2",
    "loguru>=0.7.3",
    "sqlalchemy>=2.0.54",
    "alembic>=1.20.0",
    "python-telegram-bot>=22.8",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "fastmcp>=4.0",
]

[project.scripts]
pay-my-bills = "pay_my_bills.bot:main"
pay-my-bills-login = "pay_my_bills.login:main"
pay-my-bills-mcp = "pay_my_bills.mcp:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pay_my_bills"]
