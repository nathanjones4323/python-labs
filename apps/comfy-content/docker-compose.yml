# ── NOTE ──────────────────────────────────────────────────────────────────────
# This compose file is configured for the Linux + NVIDIA GPU path.
# On M1/Apple Silicon, Docker cannot access the Metal GPU, so use the native
# setup instead:  make setup-mac && make start-mac
# ─────────────────────────────────────────────────────────────────────────────

services:
  comfyui:
    # Linux + NVIDIA GPU image:
    image: ghcr.io/ai-dock/comfyui:latest-cuda
    # CPU-only fallback (slow, cross-platform):
    # image: ghcr.io/ai-dock/comfyui:latest-cpu
    ports:
      - "8188:8188"
    environment:
      - DIRECT_ADDRESS=0.0.0.0
      - DIRECT_ADDRESS_GET_WAN=false
      - WEB_ENABLE_AUTH=false
      # Uncomment if you need HuggingFace token for gated models
      # - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ./models:/opt/ComfyUI/models
      - ./workflows:/opt/ComfyUI/workflows
      - ./assets:/opt/ComfyUI/input
      - ./output:/opt/ComfyUI/output
      - comfyui_custom_nodes:/opt/ComfyUI/custom_nodes
    # ── NVIDIA GPU passthrough (Linux only) ───────────────────────────────────
    # Remove or comment out this entire deploy block when running on a machine
    # without NVIDIA drivers — Docker Compose will error if the nvidia runtime
    # is missing even if you don't have a GPU attached.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # ─────────────────────────────────────────────────────────────────────────
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8188/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  comfyui_custom_nodes:
