name: Tee Time Booker

on:
  # Sunday 06:40 UTC = 11:40 PM PDT / 10:40 PM PST Saturday. Soule Park
  # releases tee times at course-local midnight; the booker logs in, then
  # waits for midnight itself (config.PRE_RELEASE_START), so this only needs
  # to land before it in both DST states. Cron minutes away from :00 are
  # less delayed by GitHub's scheduler.
  schedule:
    - cron: "40 6 * * 0"
  # Manual "Run workflow" button in the Actions tab.
  workflow_dispatch:
    inputs:
      submit_payment:
        description: "Actually submit payment (otherwise dry run up to the final step)"
        type: boolean
        default: false
      target_date:
        description: "Book this date (YYYY-MM-DD) instead of the computed Saturday; skips the midnight wait"
        type: string
        default: ""
      plan:
        description: "Booking plan id to run (see --list-plans); blank uses the TEE_TIME_PLAN variable"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: tee-time-booker
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-latest
    # Covers the pre-midnight wait (up to ~80 min in PST) plus the booking.
    timeout-minutes: 110
    defaults:
      run:
        working-directory: apps/tee-time-booker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: .
        run: uv sync --package tee-time-booker --no-dev

      - name: Install Playwright Chromium
        run: uv run --package tee-time-booker playwright install --with-deps chromium

      - name: Migrate database
        run: uv run --package tee-time-booker alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Book tee time
        run: uv run --package tee-time-booker python -m tee_time_booker
        env:
          # Runs, requests and plans live here; see the README's "Database".
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Manual runs can opt in via the input. Scheduled runs follow the repo
          # variable TEE_TIME_SUBMIT_PAYMENT (Settings > Secrets and variables >
          # Actions > Variables); unset means dry run.
          TEE_TIME_SUBMIT_PAYMENT: ${{ github.event.inputs.submit_payment || vars.TEE_TIME_SUBMIT_PAYMENT || 'false' }}
          TEE_TIME_TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
          # Which booking plan the run books (a UUID from `--list-plans`). The
          # cron above is timed for Soule Park's midnight release, so keep the
          # variable pointing at a Soule Park plan unless the schedule moves
          # with it.
          TEE_TIME_PLAN: ${{ github.event.inputs.plan || vars.TEE_TIME_PLAN }}
          TEE_TIME_HEADLESS: "true"
          TEE_TIME_ARTIFACTS_DIR: artifacts
          SOULE_EMAIL: ${{ secrets.SOULE_EMAIL }}
          SOULE_PASSWORD: ${{ secrets.SOULE_PASSWORD }}
          GOLFNOW_EMAIL: ${{ secrets.GOLFNOW_EMAIL }}
          GOLFNOW_PASSWORD: ${{ secrets.GOLFNOW_PASSWORD }}
          CREDIT_CARD_NUMBER: ${{ secrets.CREDIT_CARD_NUMBER }}
          CREDIT_CARD_EXPIRATION_MONTH: ${{ secrets.CREDIT_CARD_EXPIRATION_MONTH }}
          CREDIT_CARD_EXPIRATION_YEAR: ${{ secrets.CREDIT_CARD_EXPIRATION_YEAR }}
          CREDIT_CARD_CVC: ${{ secrets.CREDIT_CARD_CVC }}
          CREDIT_CARD_POSTAL_CODE: ${{ secrets.CREDIT_CARD_POSTAL_CODE }}
          # Only GolfNow's checkout asks for these.
          CREDIT_CARD_NAME: ${{ secrets.CREDIT_CARD_NAME }}
          CREDIT_CARD_BILLING_ADDRESS: ${{ secrets.CREDIT_CARD_BILLING_ADDRESS }}
          CREDIT_CARD_STATE: ${{ secrets.CREDIT_CARD_STATE }}
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tee-time-booker-artifacts
          path: apps/tee-time-booker/artifacts/
          if-no-files-found: ignore
          retention-days: 14
